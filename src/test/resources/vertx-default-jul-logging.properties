# Vert.x default JUL (Java Util Logging) configuration
# This file is automatically loaded by Vert.x

# Suppress Vert.x and Netty logs completely
io.vertx.level=OFF
io.netty.level=OFF

# Suppress specific Vert.x components
io.vertx.core.level=OFF
io.vertx.core.http.level=OFF
io.vertx.core.impl.level=OFF
io.vertx.core.net.level=OFF
io.netty.channel.level=OFF
io.netty.handler.level=OFF
io.netty.util.level=OFF
io.netty.buffer.level=OFF
