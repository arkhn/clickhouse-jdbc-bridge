name: Build

on:
  push:
    branches:
      - master
      - develop
    paths-ignore:
      - "**.md"
      - "misc/**"

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths-ignore:
      - "**.md"
      - "misc/**"

jobs:
  java:
    name: "Build and verify Java code..."
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots verify

  docker:
    name: "Build and verify Dockerfiles..."
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Base Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.base
          push: false
          load: true
          tags: arkhn/clickhouse-jdbc-bridge:base
      - name: Build Full Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          build-args: |
            BASE_IMAGE=arkhn/clickhouse-jdbc-bridge:base
          tags: arkhn/clickhouse-jdbc-bridge:full
      - name: Build All-in-one Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./all-in-one.Dockerfile
          push: false
          tags: arkhn/clickhouse-jdbc-bridge:all-in-one
