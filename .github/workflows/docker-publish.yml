name: Docker Publish

# Reusable workflow that builds the multi-stage Dockerfile and pushes tags to
# Docker Hub. Caller passes the SemVer string (e.g. "1.0.4" or "1.0.4-rc.3")
# and a boolean `is_prerelease`:
#
#   is_prerelease=false (stable):
#     :v{VERSION}, :v{VERSION}-full
#     :v{MAJOR}.{MINOR}, :v{MAJOR}.{MINOR}-full   (rolling within minor)
#     :v{MAJOR}, :v{MAJOR}-full                   (rolling within major)
#     :full                                       (rolling latest stable; gated by `tag_full`)
#
#   is_prerelease=true (RC):
#     :v{VERSION}, :v{VERSION}-full   only
#     No rolling tags ever — consumers pinning to :vN or :full should never
#     auto-upgrade to a candidate.
#
# We deliberately do NOT publish :latest — pin to :vMAJOR or a specific
# :vX.Y.Z to avoid cross-major surprise upgrades.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Full SemVer version (e.g. 1.0.4 or 1.0.4-rc.3)"
        required: true
        type: string
      is_prerelease:
        description: "If true, only push the version-pinned tags (no rolling)"
        required: false
        type: boolean
        default: false
      tag_full:
        description: "Also push the :full mutable tag (stable only)"
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      version:
        description: "Full SemVer version (e.g. 1.0.4 or 1.0.4-rc.3)"
        required: true
        type: string
      is_prerelease:
        description: "If true, only push the version-pinned tags (no rolling)"
        required: false
        type: boolean
        default: false
      tag_full:
        description: "Also push the :full mutable tag (stable only)"
        required: false
        type: boolean
        default: true

env:
  REGISTRY_IMAGE: arkhn/clickhouse-jdbc-bridge

jobs:
  build-full:
    name: "Build and Push Full Image"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compute tags
        id: tags
        env:
          VERSION: ${{ inputs.version }}
          IS_PRERELEASE: ${{ inputs.is_prerelease }}
          TAG_FULL: ${{ inputs.tag_full }}
        run: |
          set -euo pipefail

          # Strip leading "v" if accidentally included.
          VERSION="${VERSION#v}"

          # Split MAJOR.MINOR.PATCH out of the SemVer base (everything before "-").
          BASE="${VERSION%%-*}"
          MAJOR="${BASE%%.*}"
          TMP="${BASE#*.}"
          MINOR="${TMP%%.*}"
          PATCH="${TMP##*.}"

          # Version-pinned tags — always pushed, RC or stable.
          TAGS="${{ env.REGISTRY_IMAGE }}:v${VERSION}-full"
          TAGS="${TAGS},${{ env.REGISTRY_IMAGE }}:v${VERSION}"

          # Rolling tags — stable releases only. A candidate must never silently
          # bump :vMAJOR or :full for downstream consumers.
          if [ "$IS_PRERELEASE" = "false" ]; then
            TAGS="${TAGS},${{ env.REGISTRY_IMAGE }}:v${MAJOR}.${MINOR}-full"
            TAGS="${TAGS},${{ env.REGISTRY_IMAGE }}:v${MAJOR}.${MINOR}"
            TAGS="${TAGS},${{ env.REGISTRY_IMAGE }}:v${MAJOR}-full"
            TAGS="${TAGS},${{ env.REGISTRY_IMAGE }}:v${MAJOR}"
            if [ "$TAG_FULL" = "true" ]; then
              TAGS="${TAGS},${{ env.REGISTRY_IMAGE }}:full"
            fi
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Computed tags:"
          echo "${TAGS}" | tr ',' '\n' | sed 's/^/  - /'

      - name: Build and Push Full Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
