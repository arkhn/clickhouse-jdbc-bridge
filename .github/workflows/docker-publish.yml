name: Docker Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g., 2.1.0)"
        required: true
        default: "2.1.0"
  workflow_call:
    inputs:
      version:
        description: "Version (e.g., 2.1.0)"
        required: true
        type: string
    secrets:
      DOCKER_LOGIN:
        required: true
      DOCKER_PASSWORD:
        required: true

env:
  REGISTRY_IMAGE: arkhn/clickhouse-jdbc-bridge
  VERSION: ${{ inputs.version || github.event.inputs.version }}

jobs:
  build-base:
    name: "Build and Push Base Image"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        run: |
          # Ensure directory exists
          mkdir -p docker-artifacts
          # Download artifacts from GitHub release with retry
          max_attempts=5
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt to download artifacts..."
            if wget -q -P docker-artifacts \
              https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/LICENSE \
              https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/NOTICE \
              https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/clickhouse-jdbc-bridge-${{ env.VERSION }}-shaded.jar; then
              echo "Artifacts downloaded successfully"
              # Rename JAR to expected name for Dockerfile
              mv docker-artifacts/clickhouse-jdbc-bridge-${{ env.VERSION }}-shaded.jar docker-artifacts/clickhouse-jdbc-bridge-shaded.jar
              # List downloaded files for verification
              ls -la docker-artifacts/
              break
            else
              if [ $attempt -eq $max_attempts ]; then
                echo "Failed to download artifacts after $max_attempts attempts"
                exit 1
              fi
              echo "Waiting 10 seconds before retry..."
              sleep 10
              attempt=$((attempt + 1))
            fi
          done

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Base Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.base
          push: true
          build-args: |
            revision=${{ env.VERSION }}
            repository=${{ github.repository }}
          tags: |
            ${{ env.REGISTRY_IMAGE }}:base
            ${{ env.REGISTRY_IMAGE }}:v${{ env.VERSION }}-base

  build-full:
    name: "Build and Push Full Image"
    runs-on: ubuntu-latest
    needs: build-base
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Full Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY_IMAGE }}:v${{ env.VERSION }}-base
          tags: |
            ${{ env.REGISTRY_IMAGE }}:full
            ${{ env.REGISTRY_IMAGE }}:v${{ env.VERSION }}-full
