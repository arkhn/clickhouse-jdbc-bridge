name: Docker Publish

on:
  workflow_dispatch:
    inputs:
      major:
        description: "Major version"
        required: true
        default: "2"
      minor:
        description: "Minor version"
        required: false
        default: "1"
      patch:
        description: "Patch"
        required: false
        default: "0"
      tag_full:
        description: "Also push the :full mutable tag"
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      major:
        description: "Major version"
        required: true
        type: string
      minor:
        description: "Minor version"
        required: false
        type: string
        default: "1"
      patch:
        description: "Patch"
        required: false
        type: string
        default: "0"
      tag_full:
        description: "Also push the :full mutable tag"
        required: false
        type: boolean
        default: true

env:
  REGISTRY_IMAGE: arkhn/clickhouse-jdbc-bridge
  VERSION: ${{ inputs.major }}.${{ inputs.minor }}.${{ inputs.patch }}

# Single-pass build of the multi-stage Dockerfile: produces `base` as an
# intermediate stage and `full` as the final image. Only `full` is tagged
# and pushed to Docker Hub — `base` stays private to the build.
jobs:
  build-full:
    name: "Build and Push Full Image"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # NOTE: we deliberately do NOT publish a :latest tag. Consumers that pin to
      # :latest end up auto-upgrading across major versions; pin to :vMAJOR (e.g.
      # :v1-full) or a specific :vX.Y.Z-full tag instead.
      - name: Compute tags
        id: tags
        run: |
          TAGS="${{ env.REGISTRY_IMAGE }}:v${{ env.VERSION }}-full"
          TAGS="${TAGS},${{ env.REGISTRY_IMAGE }}:v${{ env.VERSION }}"
          TAGS="${TAGS},${{ env.REGISTRY_IMAGE }}:v${{ inputs.major }}.${{ inputs.minor }}-full"
          TAGS="${TAGS},${{ env.REGISTRY_IMAGE }}:v${{ inputs.major }}.${{ inputs.minor }}"
          TAGS="${TAGS},${{ env.REGISTRY_IMAGE }}:v${{ inputs.major }}-full"
          TAGS="${TAGS},${{ env.REGISTRY_IMAGE }}:v${{ inputs.major }}"
          if [ "${{ inputs.tag_full }}" = "true" ]; then
            TAGS="${TAGS},${{ env.REGISTRY_IMAGE }}:full"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Full Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
