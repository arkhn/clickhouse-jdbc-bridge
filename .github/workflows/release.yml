name: Release

# Model (mirrors arkhn/helm-charts):
#   - push to master       -> X.Y.Z-rc.N (prerelease, from .releaserc.json)
#   - workflow_dispatch on master  -> X.Y.Z (stable; semantic-release `branches:`
#                                    override forces the current ref to be
#                                    treated as a stable release branch)
#   - push to v<N>.x       -> stable patch on that maintenance line
#
# After the first stable of a new major: the prior major's last stable tag is
# archived to v<prior>.x. At most 3 major maintenance branches are kept on the
# remote (oldest pruned).

on:
  push:
    branches:
      - master
      - 'v*.x'
    paths-ignore:
      - '**.md'
      - 'misc/**'
  # Manual trigger from the GitHub UI. Use this on `master` to promote the
  # current rc cycle to a stable release. Triggering on a `v*.x` branch is
  # equivalent to pushing to it (a stable patch on that line).
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: "Semantic Release"
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
      new_release_major_version: ${{ steps.semantic.outputs.new_release_major_version }}
      new_release_minor_version: ${{ steps.semantic.outputs.new_release_minor_version }}
      new_release_patch_version: ${{ steps.semantic.outputs.new_release_patch_version }}
    steps:
      - name: Generate bot app token
        id: generate_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ARKHN_RELEASER_APP_ID }}
          private-key: ${{ secrets.ARKHN_RELEASER_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate_token.outputs.token }}
          fetch-depth: 0
          persist-credentials: true

      - name: Get bot user ID
        id: bot-user-id
        run: |
          echo "user-id=$(gh api "/users/${{ steps.generate_token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}

      - name: Configure Git
        run: |
          git config user.name "${{ steps.generate_token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.bot-user-id.outputs.user-id }}+${{ steps.generate_token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          dry_run: false
          # Pin the whole toolchain. Unpinned, the action installs the latest
          # semantic-release and (below) the latest conventional-changelog
          # preset — which is how the 1.2.0 line shipped with EMPTY release
          # notes: preset 10.x is incompatible with the release-notes-generator
          # bundled in semantic-release 24 (generator 14), so commit-analyzer
          # still bumped the version while the notes rendered blank.
          semantic_version: 24.2.9
          # On workflow_dispatch (manual trigger), force the current branch to
          # be treated as a stable release branch. On regular pushes, fall
          # through to .releaserc.json — which makes master prerelease=rc.
          branches: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || '' }}
          # Pin conventional-changelog-conventionalcommits to the 9.x line:
          # semantic-release@24 (release-notes-generator@14) needs preset 9.x,
          # not 10.x. Matches arkhn/helm-charts. Bump these two in lockstep.
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/exec
            @semantic-release/git
            conventional-changelog-conventionalcommits@9
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
          GIT_AUTHOR_NAME: "${{ steps.generate_token.outputs.app-slug }}[bot]"
          GIT_COMMITTER_NAME: "${{ steps.generate_token.outputs.app-slug }}[bot]"
          GIT_AUTHOR_EMAIL: "${{ steps.bot-user-id.outputs.user-id }}+${{ steps.generate_token.outputs.app-slug }}[bot]@users.noreply.github.com"
          GIT_COMMITTER_EMAIL: "${{ steps.bot-user-id.outputs.user-id }}+${{ steps.generate_token.outputs.app-slug }}[bot]@users.noreply.github.com"

      # After the first stable of a new major lands on master, archive the
      # prior major to v<prior>.x at its last stable tag. Then prune so at
      # most 3 major maintenance branches live on origin.
      - name: Archive prior major and prune
        if: |
          steps.semantic.outputs.new_release_published == 'true'
          && !contains(steps.semantic.outputs.new_release_version, '-')
          && github.ref_name == 'master'
        env:
          NEW_MAJOR: ${{ steps.semantic.outputs.new_release_major_version }}
          NEW_VERSION: ${{ steps.semantic.outputs.new_release_version }}
        run: |
          set -euo pipefail
          # Count pre-existing stable tags for this major (exclude the new one).
          EXISTING=$(git tag --list "v${NEW_MAJOR}.*" | grep -vE -- '-' | grep -v "^v${NEW_VERSION}$" | wc -l)
          if [ "$EXISTING" -eq 0 ]; then
            PRIOR_MAJOR=$(git tag --list 'v*' | grep -vE -- '-' | sed -E 's/^v([0-9]+).*/\1/' | sort -un | awk -v new="$NEW_MAJOR" '$1 < new' | tail -n 1)
            if [ -n "$PRIOR_MAJOR" ]; then
              ARCHIVAL_BRANCH="v${PRIOR_MAJOR}.x"
              if git ls-remote --exit-code --heads origin "$ARCHIVAL_BRANCH" >/dev/null 2>&1; then
                echo "ℹ️ $ARCHIVAL_BRANCH already exists; skipping archival."
              else
                LAST_OLD_STABLE=$(git tag --list "v${PRIOR_MAJOR}.*" | grep -vE -- '-' | sort -V | tail -n 1)
                if [ -n "$LAST_OLD_STABLE" ]; then
                  echo "📦 Archiving major $PRIOR_MAJOR: creating $ARCHIVAL_BRANCH at $LAST_OLD_STABLE"
                  git branch "$ARCHIVAL_BRANCH" "$LAST_OLD_STABLE"
                  git push origin "$ARCHIVAL_BRANCH"
                fi
              fi
            fi
          fi
          # Prune: keep at most 3 major maintenance branches.
          maint=$(git ls-remote --heads origin | awk '{print $2}' | sed 's|refs/heads/||' | grep -E '^v[0-9]+\.x$' | sort -V)
          total=$(printf '%s\n' "$maint" | grep -c . || true)
          if [ "$total" -gt 3 ]; then
            echo "Found $total major maintenance branches; pruning to 3"
            printf '%s\n' "$maint" | head -n -3 | while read -r branch; do
              [ -z "$branch" ] && continue
              echo "🗑️ Pruning $branch"
              git push origin --delete "$branch"
            done
          else
            echo "Found $total major maintenance branches; no pruning needed"
          fi

  publish-docker:
    name: "Publish Docker images"
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.release.outputs.new_release_version }}
      # `is_prerelease` mirrors what semantic-release decided: rc versions
      # contain a "-", stable ones don't.
      is_prerelease: ${{ contains(needs.release.outputs.new_release_version, '-') }}
    secrets: inherit
