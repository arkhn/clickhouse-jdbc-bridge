name: Release

on:
  push:
    branches:
      - master
      - next
      - 'v*.x'
    paths-ignore:
      - '**.md'
      - 'misc/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (compute next version but do not publish)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: "Semantic Release"
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
      new_release_major_version: ${{ steps.semantic.outputs.new_release_major_version }}
      new_release_minor_version: ${{ steps.semantic.outputs.new_release_minor_version }}
      new_release_patch_version: ${{ steps.semantic.outputs.new_release_patch_version }}
    steps:
      - name: Generate bot app token
        id: generate_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ARKHN_RELEASER_APP_ID }}
          private-key: ${{ secrets.ARKHN_RELEASER_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate_token.outputs.token }}
          fetch-depth: 0
          persist-credentials: true

      - name: Get bot user ID
        id: bot-user-id
        run: |
          echo "user-id=$(gh api "/users/${{ steps.generate_token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}

      - name: Configure Git
        run: |
          git config user.name "${{ steps.generate_token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.bot-user-id.outputs.user-id }}+${{ steps.generate_token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          server-id: ossrh
          server-username: SONATYPE_USER
          server-password: SONATYPE_PASSWD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          dry_run: ${{ github.event.inputs.dry_run || 'false' }}
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/exec
            @semantic-release/git
            conventional-changelog-conventionalcommits
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
          GIT_AUTHOR_NAME: "${{ steps.generate_token.outputs.app-slug }}[bot]"
          GIT_COMMITTER_NAME: "${{ steps.generate_token.outputs.app-slug }}[bot]"
          GIT_AUTHOR_EMAIL: "${{ steps.bot-user-id.outputs.user-id }}+${{ steps.generate_token.outputs.app-slug }}[bot]@users.noreply.github.com"
          GIT_COMMITTER_EMAIL: "${{ steps.bot-user-id.outputs.user-id }}+${{ steps.generate_token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Publish Maven artifacts (deb / rpm / jar + OSSRH)
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          mvn -Prelease \
              -Drevision=${{ steps.semantic.outputs.new_release_version }} \
              --batch-mode \
              --update-snapshots \
              deploy
        env:
          SONATYPE_USER: ${{ secrets.SONATYPE_USER }}
          SONATYPE_PASSWD: ${{ secrets.SONATYPE_PASSWD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          TESTCONTAINERS_RYUK_DISABLED: true

      - name: Attach binaries to GitHub release
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.semantic.outputs.new_release_version }}"
          files: |
            LICENSE
            NOTICE
            target/clickhouse-jdbc-bridge-*.jar
            target/*.deb
            target/**/*.rpm
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}

      - name: Create / update maintenance branch (v<major>.x)
        if: steps.semantic.outputs.new_release_published == 'true' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/next')
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          CURRENT_MAJOR=${{ steps.semantic.outputs.new_release_major_version }}
          CURRENT_MAJOR_BRANCH="v${CURRENT_MAJOR}.x"

          echo "➡️  New major version: $CURRENT_MAJOR"
          echo "➡️  Maintenance branch: $CURRENT_MAJOR_BRANCH"

          git fetch --all
          SOURCE_BRANCH=$(echo "$BRANCH_NAME" | sed 's|refs/heads/||')
          git checkout "$SOURCE_BRANCH"
          git pull origin "$SOURCE_BRANCH" || true

          if ! git diff-index --quiet HEAD --; then
            git stash push -m "Temporary stash before maintenance branch checkout"
          fi

          if git ls-remote --heads origin "$CURRENT_MAJOR_BRANCH" | grep -q "$CURRENT_MAJOR_BRANCH"; then
            echo "✅ Branch '$CURRENT_MAJOR_BRANCH' already exists. Updating it..."
            git checkout "$CURRENT_MAJOR_BRANCH"
            git pull origin "$CURRENT_MAJOR_BRANCH" || true

            if git merge --ff-only "$SOURCE_BRANCH" 2>/dev/null; then
              echo "✅ Fast-forward merge successful"
            else
              echo "⚠️  Cannot fast-forward, performing regular merge..."
              git merge --no-ff -m "chore: merge $SOURCE_BRANCH into $CURRENT_MAJOR_BRANCH" "$SOURCE_BRANCH" || {
                echo "⚠️  Merge conflict — resolving with -X theirs"
                git merge --abort 2>/dev/null || true
                git merge -X theirs --no-ff -m "chore: merge $SOURCE_BRANCH into $CURRENT_MAJOR_BRANCH" "$SOURCE_BRANCH"
              }
            fi
            git commit --allow-empty -m "chore(release): ${{ steps.semantic.outputs.new_release_version }}"
            git push origin "$CURRENT_MAJOR_BRANCH"
          else
            echo "🚀 Creating maintenance branch '$CURRENT_MAJOR_BRANCH'..."
            git reset --hard HEAD
            git checkout -b "$CURRENT_MAJOR_BRANCH"
            git push origin "$CURRENT_MAJOR_BRANCH"
          fi

  publish-docker:
    name: "Publish Docker images"
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    uses: ./.github/workflows/docker-publish.yml
    with:
      major: ${{ needs.release.outputs.new_release_major_version }}
      minor: ${{ needs.release.outputs.new_release_minor_version }}
      patch: ${{ needs.release.outputs.new_release_patch_version }}
    secrets: inherit
