name: Release

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    name: "Release"
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.outputs.new_release_published || 'false' }}
      new_release_version: ${{ steps.outputs.new_release_version || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          dry_run: false
          branch: ${{ github.ref_name }}
          extra_plugins: |
            @semantic-release/exec
            conventional-changelog-conventionalcommits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set outputs
        id: outputs
        run: |
          echo "new_release_published=${{ steps.semantic.outputs.new_release_published || 'false' }}" >> $GITHUB_OUTPUT
          echo "new_release_version=${{ steps.semantic.outputs.new_release_version || '' }}" >> $GITHUB_OUTPUT

      - name: Upload build artifacts
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            target/clickhouse-jdbc-bridge-*-shaded.jar
            LICENSE
            NOTICE
          retention-days: 1

  publish-docker:
    name: "Publish Docker Images"
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.release.outputs.new_release_version }}
    secrets:
      DOCKER_LOGIN: ${{ secrets.DOCKER_LOGIN }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
